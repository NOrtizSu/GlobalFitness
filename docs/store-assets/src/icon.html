<!-- Launcher icon (ic_launcher_background + ic_launcher_foreground vector drawables) rendered as a full-bleed 512x512 square.
     The 108 dp adaptive canvas is cropped to its central 72 dp so the glyph has the same proportions as on a launcher.
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --default-background-color=00000000 --window-size=512,512 --screenshot=icon-512.png icon.html
     Then convert to RGBA (32-bit): Image.open(...).convert("RGBA").save(...) -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108">
<stop offset="0" stop-color="#3E8CE6"/><stop offset="0.5" stop-color="#2A78D6"/><stop offset="1" stop-color="#1C5DB2"/></linearGradient></defs>
<rect x="0" y="0" width="108" height="108" fill="url(#g)"/>

</g></svg></body></html>
